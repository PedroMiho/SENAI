<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoramento de EPI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container-box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    width: 750px;
    text-align: center;
}

video {
    border-radius: 10px;
    width: 100%;
}

.ok {
    color: green;
    font-weight: bold;
}

.alerta {
    color: red;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container-box">
    <h4 class="mb-3">🛡 Monitoramento Automático de EPI</h4>
    
    <video id="video" autoplay></video>
    
    <div id="status" class="mt-3"></div>
    <div id="resultado" class="mt-3"></div>
</div>

<script>

// ===============================
// CONFIGURE AQUI
// ===============================
const endpoint = "https://tercioduarte-prediction.cognitiveservices.azure.com";
const projectId = "0bc9c2c7-e907-41b8-83fd-529769eef84f";
const iterationName = "Iteration1";
const predictionKey = "4aVLefcrpVvoPlXEslTLRzHnnLtf4jL58infJ2SFcrQyBwKl4PySJQQJ99CCACYeBjFXJ3w3AAAIACOG3jzy";

// ===============================

const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.srcObject = stream;
})
.catch(err => {
    document.getElementById("status").innerHTML =
        `<p class="alerta">Erro ao acessar câmera</p>`;
});

// Aguarda vídeo carregar antes de iniciar monitoramento
video.addEventListener("loadedmetadata", () => {
    setInterval(analisar, 2000); // Analisa a cada 2 segundos
});

async function analisar() {

    if (video.videoWidth === 0) return;

    try {

        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0);

        const blob = await new Promise((resolve, reject) => {
            canvas.toBlob((blob) => {
                if (!blob || blob.size === 0) {
                    reject("Imagem vazia");
                } else {
                    resolve(blob);
                }
            }, "image/jpeg", 0.9);
        });

        const url = `${endpoint}/customvision/v3.0/Prediction/${projectId}/detect/iterations/${iterationName}/image`;

        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Prediction-Key": predictionKey,
                "Content-Type": "application/octet-stream"
            },
            body: blob
        });

        if (!response.ok) {
            throw new Error("Erro HTTP " + response.status);
        }

        const data = await response.json();

        if (!data.predictions) return;

        processarResultado(data.predictions);

    } catch (error) {
        console.error(error);
    }
}

function processarResultado(predictions) {

    const threshold = 0.80;

    let capacete = false;
    let oculos = false;
    let auricular = false;

    predictions.forEach(p => {

        if (p.probability >= threshold) {

            console.log(`${p.tagName} - ${(p.probability * 100).toFixed(2)}%`);

            if (p.tagName === "capacete") capacete = true;
            if (p.tagName === "oculos") oculos = true;
            if (p.tagName === "auricular") auricular = true;
        }
    });

    document.getElementById("resultado").innerHTML = `
        <p class="${capacete ? 'ok' : 'alerta'}">
        🪖 Capacete: ${capacete ? 'OK' : 'NÃO DETECTADO'}
        </p>

        <p class="${oculos ? 'ok' : 'alerta'}">
        🥽 Óculos: ${oculos ? 'OK' : 'NÃO DETECTADO'}
        </p>

        <p class="${auricular ? 'ok' : 'alerta'}">
        🎧 Auricular: ${auricular ? 'OK' : 'NÃO DETECTADO'}
        </p>
    `;
}

</script>

</body>
</html>
