<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Classificador Inteligente</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
}

.card-camera {
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

video {
    border-radius: 15px;
}

.status-box {
    font-size: 1.2rem;
}
</style>
</head>

<body class="d-flex align-items-center">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card card-camera p-4 text-center">
                <h3 class="mb-3 text-primary">♻ Classificador de Recicláveis</h3>

                <video id="camera" class="w-100 mb-3" autoplay></video>
                <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

                <div class="status-box mt-3">
                    <p>Objeto Detectado:</p>
                    <span id="objeto" class="badge bg-secondary p-2">Aguardando...</span>
                </div>

                <div class="status-box mt-3">
                    <p>Cor Enviada ao ESP32:</p>
                    <span id="cor" class="badge bg-dark p-2">---</span>
                </div>

            </div>

        </div>
    </div>
</div>

<script>

const ESP_IP = "192.168.0.105"; // IP do ESP32
const API_URL = "URL_DO_SEU_SERVICO"; // Endpoint da IA

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const context = canvas.getContext("2d");

const objetoBadge = document.getElementById("objeto");
const corBadge = document.getElementById("cor");

// Ativar câmera
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.srcObject = stream;
});

// Captura e classifica automaticamente
async function classificarImagem() {

    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imagemBase64 = canvas.toDataURL("image/jpeg");

    try {

        const resposta = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: imagemBase64 })
        });

        const resultado = await resposta.json();
        const objeto = resultado.label;

        objetoBadge.innerText = objeto;
        objetoBadge.className = "badge bg-info p-2";

        enviarParaESP(objeto);

    } catch (erro) {
        console.error("Erro IA:", erro);
    }
}

function enviarParaESP(objeto) {

    let cor = "";
    let corBootstrap = "bg-dark";

    if (objeto === "Metal") {
        cor = "amarelo";
        corBootstrap = "bg-warning text-dark";
    }
    else if (objeto === "Plastico") {
        cor = "vermelho";
        corBootstrap = "bg-danger";
    }
    else if (objeto === "Vidro") {
        cor = "verde";
        corBootstrap = "bg-success";
    }

    if (cor !== "") {

        fetch(`http://${ESP_IP}/cor?valor=${cor}`)
        .then(response => response.text())
        .then(data => {
            corBadge.innerText = cor;
            corBadge.className = `badge ${corBootstrap} p-2`;
        })
        .catch(error => console.error("Erro ESP:", error));
    }
}

// Executa automaticamente a cada 4 segundos
setInterval(classificarImagem, 4000);

</script>

</body>
</html>
