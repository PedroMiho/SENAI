<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Consulta de Produtos</title>

    <!-- Bootstrap 5 -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-10">

            <div class="card shadow">
                <div class="card-body">

                    <h3 class="card-title text-center mb-4">
                        Produtos Cadastrados
                    </h3>

                    <div class="d-grid mb-3">
                        <button class="btn btn-primary" onclick="listarProdutos()">
                            Consultar Produtos
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle text-center">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Tipo</th>
                                    <th>Marca</th>
                                    <th>Tamanho</th>
                                    <th>Quantidade</th>
                                    <th>Preço</th>
                                    <th>Valor Total</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaProdutos">
                                <!-- Dados preenchidos via JS -->
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-3">
                        <pre class="bg-body-secondary p-3 rounded" id="resposta"></pre>
                    </div>

                </div>
            </div>

        </div>
    </div>

</div>

<script>
    function listarProdutos() {

        fetch("http://localhost:8080/roupas")
            .then(response => response.json())
            .then(dados => {

                const tabela = document.getElementById("tabelaProdutos");
                tabela.innerHTML = "";

                if (dados.length === 0) {
                    tabela.innerHTML = `
                        <tr>
                            <td colspan="7">Nenhum produto encontrado</td>
                        </tr>
                    `;
                    return;
                }

                dados.forEach(produto => {

                    const valorTotal = produto.quantidade * produto.preco;

                    tabela.innerHTML += `
                        <tr>
                            <td>${produto.id}</td>
                            <td>${produto.tipo}</td>
                            <td>${produto.marca}</td>
                            <td>${produto.tamanho}</td>
                            <td>${produto.quantidade}</td>
                            <td>R$ ${produto.preco.toFixed(2)}</td>
                            <td><strong>R$ ${valorTotal.toFixed(2)}</strong></td>
                        </tr>
                    `;
                });

                document.getElementById("resposta").textContent =
                    "Consulta realizada com sucesso.";

            })
            .catch(error => {
                document.getElementById("resposta").textContent =
                    "Erro ao consultar a API.";
            });
    }
</script>

</body>
</html>
